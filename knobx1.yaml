# Binepad KnobX1 -> M5Stack AtomS3-Lite (USB host) -> Home Assistant / Music Assistant
#
# Power the Atom from the 5V/GND breakout header; the USB-C port is used in host
# mode for the knob and must not be used for power at the same time.

substitutions:
  name: knob-livingroom
  friendly_name: Knob Living Room
  # How close together two pushes must be to count as a double push. Also the
  # delay before a single push toggles mute.
  double_push_window: 0.35s
  # A push shorter than this is a tap; longer than long_push_time it is a hold.
  # The small gap between the two keeps a borderline push from matching both.
  short_push_max: 0.55s
  long_push_time: 0.6s
  # Dim white shown while the player is not playing. 51 is 20% of 255.
  idle_brightness: "51"
  # rgblight breathing animation: 2 is the slowest, 5 the fastest.
  breathe_effect: "2"
  # Underglow floor, 0-255. The LEDs never go below this, so the blue/green and
  # green/red transitions dim but stay clearly lit.
  led_min_brightness: "110"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# AtomS3-Lite is the same ESP32-S3FN8 module/pinout as the AtomS3 without the LCD.
esp32:
  board: m5stack-atoms3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [usb_knob]

logger:
  level:
    DEBUG
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

usb_host:

usb_knob:
  id: knob1
  # vid/pid/interface/endpoint/report_id all default to the KnobX1 values;
  # listed here only to document them.
  vid: 0x5831
  pid: 0x4249
  interface: 2
  endpoint: 0x84
  report_id: 0x04

binary_sensor:
  - platform: usb_knob
    usb_knob_id: knob1
    key: volume_up
    name: Volume Up
    on_press:
      - homeassistant.action:
          action: media_player.volume_up
          data:
            entity_id: media_player.louder_esp32_plus
  - platform: usb_knob
    usb_knob_id: knob1
    key: volume_down
    name: Volume Down
    on_press:
      - homeassistant.action:
          action: media_player.volume_down
          data:
            entity_id: media_player.louder_esp32_plus
  - platform: usb_knob
    usb_knob_id: knob1
    key: mute
    name: Mute
    # Push once to toggle mute, twice quickly to skip to the next track, or hold
    # to play/pause. The single-push branch has to wait out the double-push
    # window before firing, so mute lands ~${double_push_window} after release.
    on_multi_click:
      - timing:
          - ON for at most ${short_push_max}
          - OFF for at most ${double_push_window}
          - ON for at most ${short_push_max}
          - OFF for at least 0.05s
        then:
          - homeassistant.action:
              action: media_player.media_next_track
              data:
                entity_id: media_player.louder_esp32_plus
      # Fires while the button is still down, so the hold gets instant feedback.
      - timing:
          - ON for at least ${long_push_time}
        then:
          - homeassistant.action:
              action: media_player.media_play_pause
              data:
                entity_id: media_player.louder_esp32_plus
      - timing:
          - ON for at most ${short_push_max}
          - OFF for at least ${double_push_window}
        then:
          - homeassistant.action:
              action: media_player.volume_mute
              data:
                entity_id: media_player.louder_esp32_plus
              data_template:
                is_volume_muted: "{{ mute }}"
              variables:
                # Toggle: send the opposite of what the player currently reports.
                mute: !lambda 'return id(player_muted).state ? "false" : "true";'

  # Mirrors the player's mute attribute back from HA so the knob can toggle it.
  - platform: homeassistant
    id: player_muted
    entity_id: media_player.louder_esp32_plus
    attribute: is_volume_muted
    internal: true
    on_state:
      - script.execute: update_underglow

# Underglow follows the player volume: blue (low) -> green (mid) -> red (high).
# Brightness peaks on the three pure colours and dips through the blends.
sensor:
  - platform: homeassistant
    id: player_volume
    entity_id: media_player.louder_esp32_plus
    attribute: volume_level
    internal: true
    on_value:
      - script.execute: update_underglow

# Player state decides whether the underglow is on at all.
text_sensor:
  - platform: homeassistant
    id: player_state
    entity_id: media_player.louder_esp32_plus
    internal: true
    on_value:
      - script.execute: update_underglow

script:
  - id: update_underglow
    mode: restart
    then:
      - lambda: |-
          // Log the player state whenever it changes, so what the device actually
          // sees can be compared against what Home Assistant shows.
          static std::string last_logged;
          if (id(player_state).state != last_logged) {
            last_logged = id(player_state).state;
            ESP_LOGI("underglow", "player state is '%s' (muted %s, volume %.2f)",
                     last_logged.c_str(), YESNO(id(player_muted).state),
                     id(player_volume).state);
          }
          // Not playing (paused, idle, off, unavailable): dim white.
          if (id(player_state).state != "playing") {
            id(knob1).set_effect(1);
            // Saturation 0 is white, so the hue does not matter.
            id(knob1).set_hsv(0, 0, ${idle_brightness});
            return;
          }
          float raw = id(player_volume).state;
          float v = clamp(isnan(raw) ? 0.0f : raw, 0.0f, 1.0f);
          // QMK hue: 0 = red, 85 = green, 170 = blue.
          uint8_t hue = (uint8_t) lroundf(170.0f * (1.0f - v));
          // Effect before colour: set_hsv() is a no-op while the underglow is off.
          // Muted: breathe at full value so the pulse has the whole range to swing through.
          if (id(player_muted).state) {
            id(knob1).set_effect(${breathe_effect});
            id(knob1).set_hsv(hue, 255, 255);
            return;
          }
          // |cos(2*pi*v)| is 1 at v = 0, 0.5 and 1, and 0 at the quarter points.
          // The sqrt flattens the dip so the blends stay bright for longer.
          float peak = sqrtf(fabsf(cosf(6.28318531f * v)));
          const float floor_v = ${led_min_brightness};
          uint8_t val = (uint8_t) lroundf(floor_v + (255.0f - floor_v) * peak);
          id(knob1).set_effect(1);
          id(knob1).set_hsv(hue, 255, val);

# Repaint periodically so the knob picks the right state back up after being
# unplugged and reattached. Redundant updates are dropped in the component, so
# this costs no USB traffic while nothing changes.
interval:
  - interval: 5s
    then:
      - script.execute: update_underglow
