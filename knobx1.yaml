# Binepad KnobX1 -> M5Stack AtomS3-Lite (USB host) -> Home Assistant / Music Assistant
#
# Power the Atom from the 5V/GND breakout header; the USB-C port is used in host
# mode for the knob and must not be used for power at the same time.

substitutions:
  name: knob-livingroom
  friendly_name: Knob Living Room
  # How close together two pushes must be to count as a double push. Also the
  # delay before a single push toggles mute.
  double_push_window: 0.35s
  # A push shorter than this is a tap; longer than long_push_time it is a hold.
  # The small gap between the two keeps a borderline push from matching both.
  short_push_max: 0.55s
  long_push_time: 0.6s
  # Dim white shown while the player is not playing, out of 255.
  idle_brightness: "100"
  # Breathing while muted, driven from the ESP so it can start at whatever
  # brightness the LEDs are already showing. Seconds per full breath, and the
  # brightness range it swings between.
  breathe_period: "4.0"
  breathe_min: "20"
  breathe_max: "255"
  # Underglow floor, 0-255. The LEDs never go below this, so the blue/green and
  # green/red transitions dim but stay clearly lit.
  led_min_brightness: "110"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# AtomS3-Lite is the same ESP32-S3FN8 module/pinout as the AtomS3 without the LCD.
esp32:
  board: m5stack-atoms3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [usb_knob]

logger:
  level:
    DEBUG
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

usb_host:

usb_knob:
  id: knob1
  # vid/pid/interface/endpoint/report_id all default to the KnobX1 values;
  # listed here only to document them.
  vid: 0x5831
  pid: 0x4249
  interface: 2
  endpoint: 0x84
  report_id: 0x04

binary_sensor:
  - platform: usb_knob
    usb_knob_id: knob1
    key: volume_up
    name: Volume Up
    on_press:
      - homeassistant.action:
          action: media_player.volume_up
          data:
            entity_id: media_player.louder_esp32_plus
  - platform: usb_knob
    usb_knob_id: knob1
    key: volume_down
    name: Volume Down
    on_press:
      - homeassistant.action:
          action: media_player.volume_down
          data:
            entity_id: media_player.louder_esp32_plus
  - platform: usb_knob
    usb_knob_id: knob1
    key: mute
    # Named for the physical gesture, not the action: the knob's press always
    # sends the mute usage code, whatever we bind it to.
    name: Push
    # Push once to play/pause, twice quickly to skip to the next track, or hold
    # to toggle mute. The single-push branch has to wait out the double-push
    # window before firing, so play/pause lands ~${double_push_window} after
    # release; the hold fires immediately.
    on_multi_click:
      - timing:
          - ON for at most ${short_push_max}
          - OFF for at most ${double_push_window}
          - ON for at most ${short_push_max}
          - OFF for at least 0.05s
        then:
          - homeassistant.action:
              action: media_player.media_next_track
              data:
                entity_id: media_player.louder_esp32_plus
      # Fires while the button is still down, so the hold gets instant feedback.
      - timing:
          - ON for at least ${long_push_time}
        then:
          - homeassistant.action:
              action: media_player.volume_mute
              data:
                entity_id: media_player.louder_esp32_plus
              data_template:
                is_volume_muted: "{{ mute }}"
              variables:
                # Toggle: send the opposite of what the player currently reports.
                mute: !lambda 'return id(player_muted).state ? "false" : "true";'
      - timing:
          - ON for at most ${short_push_max}
          - OFF for at least ${double_push_window}
        then:
          - homeassistant.action:
              action: media_player.media_play_pause
              data:
                entity_id: media_player.louder_esp32_plus

  # Mirrors the player's mute attribute back from HA so the knob can toggle it.
  - platform: homeassistant
    id: player_muted
    entity_id: media_player.louder_esp32_plus
    attribute: is_volume_muted
    internal: true
    on_state:
      - script.execute: update_underglow

# Underglow follows the player volume: blue (low) -> green (mid) -> red (high).
# Brightness peaks on the three pure colours and dips through the blends.
sensor:
  - platform: homeassistant
    id: player_volume
    entity_id: media_player.louder_esp32_plus
    attribute: volume_level
    internal: true
    on_value:
      - script.execute: update_underglow

# Player state decides whether the underglow is on at all.
text_sensor:
  - platform: homeassistant
    id: player_state
    entity_id: media_player.louder_esp32_plus
    internal: true
    on_value:
      - script.execute: update_underglow

globals:
  - id: breathe_phase
    type: float
    restore_value: false
    initial_value: '0.0f'
  # Brightness currently on the LEDs, used to seed the breathing phase.
  - id: current_val
    type: int
    restore_value: false
    initial_value: '0'

script:
  - id: update_underglow
    mode: restart
    then:
      - lambda: |-
          // Log the player state whenever it changes, so what the device actually
          // sees can be compared against what Home Assistant shows.
          static std::string last_logged;
          if (id(player_state).state != last_logged) {
            last_logged = id(player_state).state;
            ESP_LOGI("underglow", "player state is '%s' (muted %s, volume %.2f)",
                     last_logged.c_str(), YESNO(id(player_muted).state),
                     id(player_volume).state);
          }

          // 0 = not playing, 1 = playing, 2 = playing but muted.
          int mode = 2;
          if (id(player_state).state != "playing") {
            mode = 0;
          } else if (!id(player_muted).state) {
            mode = 1;
          }
          static int last_mode = -1;

          // Static light throughout: the breathing is driven from here, not by
          // the knob's own animation, which always restarts from fully dark.
          id(knob1).set_effect(1);

          float raw = id(player_volume).state;
          float v = clamp(isnan(raw) ? 0.0f : raw, 0.0f, 1.0f);
          // QMK hue: 0 = red, 85 = green, 170 = blue.
          uint8_t hue = (uint8_t) lroundf(170.0f * (1.0f - v));

          if (mode == 0) {
            // Saturation 0 is white, so the hue does not matter.
            id(current_val) = ${idle_brightness};
            id(knob1).set_hsv(0, 0, ${idle_brightness});
          } else if (mode == 1) {
            // |cos(2*pi*v)| is 1 at v = 0, 0.5 and 1, and 0 at the quarter points.
            // The sqrt flattens the dip so the blends stay bright for longer.
            float peak = sqrtf(fabsf(cosf(6.28318531f * v)));
            const float floor_v = ${led_min_brightness};
            id(current_val) = (int) lroundf(floor_v + (255.0f - floor_v) * peak);
            id(knob1).set_hsv(hue, 255, (uint8_t) id(current_val));
          } else if (last_mode != 2) {
            // Entering mute: start the breath at the brightness already showing,
            // on the rising half of the curve, so there is no visible jump.
            float span = ${breathe_max} - ${breathe_min};
            float b0 = clamp((id(current_val) - ${breathe_min}) / span, 0.0f, 1.0f);
            id(breathe_phase) = acosf(1.0f - 2.0f * b0);
          }
          last_mode = mode;

# Breathing steps while muted. set_hsv() only sends the brightness command when
# the hue is unchanged, so each step costs a single 32-byte report.
interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (id(player_state).state != "playing" || !id(player_muted).state)
            return;
          id(breathe_phase) += 6.28318531f * 0.05f / ${breathe_period};
          if (id(breathe_phase) > 6.28318531f)
            id(breathe_phase) -= 6.28318531f;
          // 0.5 - 0.5*cos rises from 0 to 1 over half a cycle and back.
          float b = 0.5f - 0.5f * cosf(id(breathe_phase));
          float span = ${breathe_max} - ${breathe_min};
          id(current_val) = (int) lroundf(${breathe_min} + span * b);
          float raw = id(player_volume).state;
          float v = clamp(isnan(raw) ? 0.0f : raw, 0.0f, 1.0f);
          uint8_t hue = (uint8_t) lroundf(170.0f * (1.0f - v));
          id(knob1).set_hsv(hue, 255, (uint8_t) id(current_val));

  # Repaint periodically so the knob picks the right state back up after being
  # unplugged and reattached. Redundant updates are dropped in the component, so
  # this costs no USB traffic while nothing changes.
  - interval: 5s
    then:
      - script.execute: update_underglow
