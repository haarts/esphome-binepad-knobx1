# Binepad KnobX1 -> M5Stack AtomS3-Lite (USB host) -> Home Assistant / Music Assistant
#
# Power the Atom from the 5V/GND breakout header; the USB-C port is used in host
# mode for the knob and must not be used for power at the same time.

substitutions:
  name: knob-livingroom
  friendly_name: Knob Living Room
  # Underglow floor, 0-255. The LEDs never go below this, so the blue/green and
  # green/red transitions dim but stay clearly lit.
  led_min_brightness: "110"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# AtomS3-Lite is the same ESP32-S3FN8 module/pinout as the AtomS3 without the LCD.
esp32:
  board: m5stack-atoms3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [usb_knob]

logger:
  level:
    DEBUG
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

usb_host:

usb_knob:
  id: knob1
  # vid/pid/interface/endpoint/report_id all default to the KnobX1 values;
  # listed here only to document them.
  vid: 0x5831
  pid: 0x4249
  interface: 2
  endpoint: 0x84
  report_id: 0x04

binary_sensor:
  - platform: usb_knob
    usb_knob_id: knob1
    key: volume_up
    name: Volume Up
    on_press:
      - homeassistant.action:
          action: media_player.volume_up
          data:
            entity_id: media_player.louder_esp32_plus
  - platform: usb_knob
    usb_knob_id: knob1
    key: volume_down
    name: Volume Down
    on_press:
      - homeassistant.action:
          action: media_player.volume_down
          data:
            entity_id: media_player.louder_esp32_plus
  - platform: usb_knob
    usb_knob_id: knob1
    key: mute
    name: Mute
    on_press:
      - homeassistant.action:
          action: media_player.volume_mute
          data:
            entity_id: media_player.louder_esp32_plus
          data_template:
            is_volume_muted: "{{ mute }}"
          variables:
            # Toggle: send the opposite of what the player currently reports.
            mute: !lambda 'return id(player_muted).state ? "false" : "true";'

  # Mirrors the player's mute attribute back from HA so the knob can toggle it.
  - platform: homeassistant
    id: player_muted
    entity_id: media_player.louder_esp32_plus
    attribute: is_volume_muted
    internal: true

# Underglow follows the player volume: blue (low) -> green (mid) -> red (high).
# Brightness peaks on the three pure colours and dips through the blends.
sensor:
  - platform: homeassistant
    id: player_volume
    entity_id: media_player.louder_esp32_plus
    attribute: volume_level
    internal: true
    on_value:
      - lambda: |-
          if (isnan(x)) return;
          float v = clamp(x, 0.0f, 1.0f);
          // QMK hue: 0 = red, 85 = green, 170 = blue.
          uint8_t hue = (uint8_t) lroundf(170.0f * (1.0f - v));
          // |cos(2*pi*v)| is 1 at v = 0, 0.5 and 1, and 0 at the quarter points.
          // The sqrt flattens the dip so the blends stay bright for longer.
          float peak = sqrtf(fabsf(cosf(6.28318531f * v)));
          const float floor_v = ${led_min_brightness};
          uint8_t val = (uint8_t) lroundf(floor_v + (255.0f - floor_v) * peak);
          id(knob1).set_hsv(hue, 255, val);
